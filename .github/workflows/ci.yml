# PR checks (required on main) and the reusable check stage of release.yml.
# Contract: ms-germina-wiki specs/003-ci-cd/contracts/pipelines.md. Nothing here touches production.
name: ci

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # "lint" stage = strict TypeScript type-check (the required check keeps its name).
      - run: npm run typecheck

      - run: npm test

      # Static Vite build to frontend/dist (type-checks again, then bundles).
      - name: Build static site
        run: npm run build

      - name: Check static output
        run: test -f frontend/dist/index.html
